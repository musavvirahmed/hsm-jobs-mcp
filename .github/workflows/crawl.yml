# Out-of-band Opening refresh (~daily). Never scrapes inside Worker tool handlers.
name: Out-of-band crawl

on:
  schedule:
    # ~daily Opening refresh for known paths (UTC morning).
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Refresh known Opening paths (fixture smoke)
        # Production D1 writes: set JOBS_INDEX_TARGET=local-d1 (default) + network secrets and drop CRAWL_SMOKE.
        # Default CI/schedule stays free-tier: exercise the operator entrypoint with fixtures.
        run: npm run crawl:smoke
        env:
          CRAWL_SMOKE: "1"
      - name: Unit tests for crawl / re-partial seam
        run: npm test -- test/out-of-band-crawl.test.ts
      - name: Full careers pass runner (fixture smoke)
        run: npm run crawl:full-pass:smoke
        env:
          CRAWL_SMOKE: "1"
          CRAWL_FULL_PASS: "1"
      - name: Unit tests for full careers pass runner
        run: npm test -- test/full-careers-pass.test.ts
